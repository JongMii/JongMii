name: GitHub-Profile-3D-Contrib

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-3d-contrib
    steps:
      - uses: actions/checkout@v4
      - uses: yoshi389111/github-profile-3d-contrib@0.6.0
        env:
          GITHUB_TOKEN: ${{ secrets.TOKEN }}
          USERNAME: ${{ github.repository_owner }}
      - name: Add black background
        run: |
          python3 - <<'EOF'
          p = 'profile-3d-contrib/profile-green-animate.svg'
          s = open(p, encoding='utf-8').read()
          # 흰 배경을 검정으로
          s = s.replace('width="1280" height="850" fill="#ffffff"', 'width="1280" height="850" fill="#0d1117"')
          # 어두운 글씨를 흰색으로
          s = s.replace('fill="#00000f"', 'fill="#ffffff"')
          s = s.replace('fill="#111133"', 'fill="#ffffff"')
          # 빈 칸(커밋 없는 타일)을 어두운 색으로
          s = s.replace('rgb(239, 239, 239)', 'rgb(33, 38, 45)')
          s = s.replace('rgb(200, 200, 200)', 'rgb(27, 31, 37)')
          s = s.replace('rgb(167, 167, 167)', 'rgb(22, 26, 31)')
          open(p, 'w', encoding='utf-8').write(s)
          EOF
      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A .
          git diff --cached --quiet || git commit -m "generated"
          git push
